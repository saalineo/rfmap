<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c14_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161C" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>
    <linearGradient id="c14_arcs" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C83FF" />
      <stop offset="60%" stop-color="#6CC4E0" />
      <stop offset="100%" stop-color="#5FD38D" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#c14_bg)" stroke="#23262D" stroke-width="2.5" />
  <rect x="9" y="9" width="494" height="494" rx="107" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Surveyor's Orthogonal Coordinate Axes from Origin (150, 362) -->
  <g stroke="#3A4354" stroke-width="2.5">
    <!-- North Axis -->
    <line x1="150" y1="362" x2="150" y2="90" />
    <!-- East Axis -->
    <line x1="150" y1="362" x2="422" y2="362" />
    <!-- South/West Extents -->
    <line x1="150" y1="362" x2="150" y2="420" stroke-dasharray="4,4" />
    <line x1="150" y1="362" x2="90" y2="362" stroke-dasharray="4,4" />
    <!-- Metric Tick Marks -->
    <line x1="142" y1="282" x2="158" y2="282" />
    <line x1="142" y1="202" x2="158" y2="202" />
    <line x1="142" y1="122" x2="158" y2="122" />
    <line x1="230" y1="354" x2="230" y2="370" />
    <line x1="310" y1="354" x2="310" y2="370" />
    <line x1="390" y1="354" x2="390" y2="370" />
  </g>

  <!-- Precision Concentric Wavefront Quadrants in Top-Right Sector -->
  <!-- Arc 1 -->
  <path d="M 150,282 A 80,80 0 0,1 230,362" fill="none" stroke="url(#c14_arcs)" stroke-width="20" stroke-linecap="round" />
  <!-- Arc 2 -->
  <path d="M 150,202 A 160,160 0 0,1 310,362" fill="none" stroke="url(#c14_arcs)" stroke-width="20" stroke-linecap="round" />
  <!-- Arc 3 -->
  <path d="M 150,122 A 240,240 0 0,1 390,362" fill="none" stroke="url(#c14_arcs)" stroke-width="20" stroke-linecap="round" />

  <!-- Surveyor Origin Datum Benchmark -->
  <circle cx="150" cy="362" r="26" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="150" cy="362" r="12" fill="#7C83FF" />
  <circle cx="150" cy="362" r="5" fill="#FFFFFF" />
</svg>